name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Poe2DesktopClock.sln -p:Platform=x64
      - run: dotnet build Poe2DesktopClock.sln -c Debug -p:Platform=x64 --no-restore
      - run: dotnet test Poe2DesktopClock.sln -c Debug -p:Platform=x64 --no-restore

  package:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore release runtime
        run: dotnet restore src/Poe2DesktopClock.Desktop/Poe2DesktopClock.Desktop.csproj -r win-x64 -p:Platform=x64
      - name: Build signed MSIX and portable ZIP
        id: package
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            "0.0.${{ github.run_number }}.0"
          }

          $arguments = @{
            Version = $version
            OutputDirectory = 'artifacts/release'
          }
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
            $arguments.GenerateDevelopmentCertificate = $true
          } else {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'poe2-desktop-clock-signing.pfx'
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
            $arguments.CertificatePath = $certificatePath
            $arguments.CertificatePassword = $env:MSIX_CERTIFICATE_PASSWORD
          }

          ./scripts/Publish-Release.ps1 @arguments
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: poe2-desktop-clock-${{ steps.package.outputs.version }}
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts/release -File | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --generate-notes --title $env:GITHUB_REF_NAME
          }
